<!DOCTYPE html>
<html>
<head>
    <title>Sharing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sharing App</h1>

<div class="container">

    <h2>Add Contact</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <button onclick="addContact()">Add Contact</button>

    <h2>Add Item</h2>
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="text" id="width" placeholder="Width">
    <input type="text" id="height" placeholder="Height">
    <input type="text" id="length" placeholder="Length">

    <select id="status">
        <option value="Available">Available</option>
        <option value="Borrowed">Borrowed</option>
    </select>

    <select id="borrower"></select>

    <button onclick="addItem()">Add Item</button>

    <h2>Items</h2>
    <ul id="itemList"></ul>

</div>

<script>
let contacts = [];
let items = [];

function addContact() {
    let username = document.getElementById("username").value;
    let email = document.getElementById("email").value;

    contacts.push({username, email});

    let select = document.getElementById("borrower");
    let option = document.createElement("option");
    option.text = username;
    select.add(option);
}

function addItem() {
    let name = document.getElementById("itemName").value;
    let status = document.getElementById("status").value;
    let borrower = document.getElementById("borrower").value;

    items.push({name, status, borrower});

    displayItems();
}

function displayItems() {
    let list = document.getElementById("itemList");
    list.innerHTML = "";

    items.forEach(item => {
        let li = document.createElement("li");
        li.innerText = item.name + " - " + item.status +
            (item.status === "Borrowed" ? " (" + item.borrower + ")" : "");
        list.appendChild(li);
    });
}
</script>

</body>
</html>
